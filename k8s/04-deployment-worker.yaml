apiVersion: apps/v1
kind: Deployment
metadata:
  name: normatividad-worker
  namespace: ocr-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: normatividad-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: normatividad-worker
        app.kubernetes.io/part-of: normatividad-services
    spec:
      containers:
        - name: worker
          image: <registro>/normatividad-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: normatividad-worker-config
            - secretRef:
                name: normatividad-services-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: ocr-shared-cache
              mountPath: /nfs-cache
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: ocr-shared-cache
          persistentVolumeClaim:
            # Creado por el repo ocr-core (storage/01-pvc-shared-cache.yaml).
            # Debe existir en este mismo namespace antes de que este pod
            # pueda arrancar - si no existe, el pod queda en Pending.
            claimName: ocr-shared-cache
