schema_version: "1.4"

documentation_model:
  version: "0.6"
  organization: by_artifact_family
  preproduction_as_complete_target: true

project:
  name: ocr-normatividad-integrador # antes normatividad-services; ese nombre se conserva en los recursos de Kubernetes (k8s/) y en los informes de licenciamiento ya emitidos
  description: >
    Integracion entre la cola OCR de Normatividad y ocr-core:
    consumo de cola (adapter/), orquestacion via HTTP hacia ocr-core, y
    busqueda documental sobre los resultados (search/). Dos servicios
    dentro de un mismo repo, fusionados porque comparten el mismo
    acoplamiento de dominio e infraestructura (ver context.md).
  kind: utility_component # no es solucion independiente, complementa el proceso OCR de Normatividad (consume su cola, procesa, devuelve resultado)
  responsible_unit: null # TODO: no hay designacion institucional formal registrada
  technical_owner: null # TODO: autor real en git es Walther Aguirre Tello, sin designacion institucional formal
  development_mode: internal # evidencia: desarrollado directamente sobre infraestructura de GORE Huanuco

governance:
  profile: generic
  directive:
    code: "N°02.S5.DI.SGMTD"
    version: "1.0"

lifecycle:
  stage: development_testing
  gorehco_hito: null # perfil generic, no aplica

version:
  current: "0.1.0" # sin tags de version en este repo
  production: true # consume la cola real de Normatividad desde el 2026-10-29 (reemplaza al worker de K8s, apagado el 2026-10-19); sin release versionado ni CI

data:
  persistent_structured_data: true # el indice de OpenSearch (search/) persiste documentos de pagina; no es una BD relacional propia
  personal_data: true # evidencia real: una prueba de busqueda devolvio un documento con nombre y circunstancia personal de una persona (permiso por lactancia materna) - los documentos de Normatividad pueden contener datos personales

documentation_context:
  incorporation_stage: development_testing
  existing_system: false # servicio nuevo, extraido del monorepo original como adapter+search independientes
  historical_design_artifacts_available: false # nunca hubo diseno formal previo

interface:
  kind: none # sin interfaz grafica; adapter es worker headless, search expone solo API HTTP consumida programaticamente
  significant_ui_change: null
  historical_prototypes_available: null
  prototype_requirement_status: not_applicable
  prototype_justification: >
    Sin interfaz de usuario final. adapter/ es un worker headless; search/
    expone GET /search consumido programaticamente, sin UI propia.

licensing:
  # Rediseñado en skill v0.6.0: licenciamiento como familia tecnica viva
  # (docs/licenciamiento/), sin revision legal ni decision institucional
  # como gates del repositorio. Sin conflicto tecnico propio - determinacion
  # de regimen queda deliberadamente pendiente (no bloqueada).
  workflow_state: evaluation_ready # evaluacion completa (final); sin regimen seleccionado por decision, no por bloqueo
  health: ok # 5 dependencias, todas permisivas, 0 incompatibles
  dependency_monitoring:
    matrix_path: docs/licenciamiento/01-dependencias/matriz-dependencias.yml
    human_view_path: docs/licenciamiento/01-dependencias/matriz-dependencias.md
    status: current
    last_sync: "2026-09-08"
    fail_on: incompatible
  evaluation:
    path: docs/licenciamiento/02-evaluacion/matriz-evaluacion-proyecto.yml
    status: final
  technical_report:
    path: docs/licenciamiento/03-determinacion/informe-tecnico-determinacion.md
    status: final
    selected_scheme: null # decision de regimen deliberadamente pendiente
    selected_spdx_id: null
  selected:
    scheme: null
    spdx_id: null
    determined_at: null
    source_report: docs/licenciamiento/03-determinacion/informe-tecnico-determinacion.md
  implementation:
    status: pending
    license_files:
      - LICENCIA.txt
      - LICENSE
      - LICENSE.txt

public_software:
  candidate: false
  published: false
  production_since: null

# Migracion a skill v0.6.0 (2026-09-08): licenciamiento se traslada de
# docs/documentacion-administrativa/licenciamiento/ a docs/licenciamiento/
# (familia tecnica transversal, no administrativa). Se eliminan como
# artefactos universales revision-legal.md, decision-institucional.md,
# texto-oficial-referencia.md y cumplimiento-licencia.md. Matrices migradas
# a schema 2.0. La determinacion de regimen sigue deliberadamente pendiente
# (sin conflicto tecnico que la fuerce, a diferencia de ocr-core que ya
# determino free_open/AGPL-3.0-only el 2026-09-08). Resto de la
# documentacion (v0.5.0) preservada sin cambios de contenido. Copia de la
# estructura v0.5.0 conservada temporalmente en docs_/ (fuera del schema,
# pendiente de evaluar su eliminacion tras verificar cero perdida de
# informacion).
paths:
  docs_root: docs
  docs_index: docs/README.md
  project_sheet: docs/proyecto/ficha-proyecto.md
  # ficha_tecnica_componente no es una clave estandar del schema v0.6
  # (additionalProperties permite extenderlo) - es el documento minimo
  # que exige el molde utility_component ademas de project_sheet.
  ficha_tecnica_componente: docs/documentacion-tecnica/ficha-tecnica-componente.md
  requirements: docs/documentacion-tecnica/reglas-negocio.md # no existe requerimientos formal separado (RF/RNF); reglas de negocio (RN-001 a RN-011) es lo unico verificable contra codigo real
  analysis: null # TODO: nunca se hizo un analisis formal
  design: null # TODO: sin documento de diseno formal unificado; ver sequence_diagrams abajo
  architecture: docs/documentacion-tecnica/arquitectura/arquitectura.md
  data_dictionary: null # TODO: pendiente - modelo de datos real (colas/estados de Normatividad) es externo, sin diagrama de referencia propio aun
  security: docs/documentacion-tecnica/seguridad/seguridad.md # GAP REAL Y URGENTE: personal_data=true, sin tratamiento formal
  personal_data: docs/documentacion-tecnica/seguridad/seguridad.md # mismo documento cubre ambos aspectos por ahora
  user_manual: null # NO_APLICA: sin interfaz de usuario final
  installation: docs/manuales/instalacion-configuracion.md
  operations: docs/manuales/instalacion-configuracion.md # seccion "Operacion contra produccion real"
  test_plan: null # TODO: hay 42 pruebas unitarias en adapter/tests, sin plan de pruebas formal
  test_cases: null # TODO: los casos viven como pruebas unitarias en adapter/tests, sin documento formal
  test_results: null # TODO: validacion real hecha contra produccion, no formalizada como resultados de prueba
  # verificacion_componente no es clave estandar del schema v0.6 (additionalProperties)
  verificacion_componente: docs/pruebas-validaciones/verificacion-componente.md
  ownership: docs/documentacion-administrativa/titularidad/titularidad.md
  production_references: null # TODO
  sequence_diagrams: docs/documentacion-tecnica/diseno/secuencias
  licensing_root: docs/licenciamiento

external_evidence:
  ownership_reference: null
  favorable_hito_report: null
  production_verification_report: null
  administrative_notes: []
