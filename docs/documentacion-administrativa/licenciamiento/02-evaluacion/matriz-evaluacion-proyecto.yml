schema_version: "1.1"
document_status: draft

reference_basis:
  type: project_model
  reference: "documentar-auditar-software-v0.3.0/references/licensing/modelo-matriz-comparativa-sgd.md"
  local_copy: docs/documentacion-administrativa/licenciamiento/02-evaluacion/catalogo-referencia.md

project:
  name: normatividad-services
  version_under_evaluation: "0.1.0"
  intended_use: >
    Adapter (consume cola OCR de Munis, llama a ocr-core) + search (indexacion
    y busqueda sobre resultados en OpenSearch). No es solucion independiente:
    complementa el proceso OCR de Munis (kind: utility_component).
  distribution_model: internal_only # corre exclusivamente dentro de la infraestructura de GORE Huanuco, sin distribucion
  spp_candidate: false

selection_requirements:
  must:
    - Ser compatible con las licencias de sus dependencias directas (todas permisivas: MIT/BSD-3/Apache-2.0, ver matriz-dependencias.yml).
    - No exponer ni comprometer los datos personales que pueden aparecer en los documentos indexados (data.personal_data: true en proyecto.yml).
  should:
    - Mantener consistencia con la licencia que finalmente se determine para ocr-core, dado que ambos repos forman parte de la misma cadena de valor.
  legal_questions:
    - "¿Una eventual publicacion del codigo fuente de este repo (sin datos, solo codigo) tendria alguna restriccion dado que procesa/indexa documentos con datos personales, aunque esos datos no viven en el repositorio de codigo?"

candidate_licenses:
  - id: MIT
    included: true
    source_reference: "modelo-matriz-comparativa-sgd.md, fila MIT"
    technical_fit: favorable
    functional_fit: favorable
    dependency_compatibility: compatible
    legal_review: pending
    spp_fit: favorable
    criteria:
      modification: "Sí"
      redistribution: "Sí"
      preserve_notices: "Sí"
      patents: "No"
      binary_distribution: "Licencia"
      copyleft: "No"
      copyleft_scope: "—"
      drm_anti_tivoization: "No"
      network_saas: "Sin restriccion"
      proprietary_combination: "Sí, cualquiera"
      relicensing: "Sí, cualquiera"
    key_obligations:
      - notice_preservation
    risks_or_restrictions: []
    observations: "Compatible con todas las dependencias actuales sin condiciones."
    conclusion: suitable

  - id: Apache-2.0
    included: true
    source_reference: "modelo-matriz-comparativa-sgd.md, fila Apache 2.0"
    technical_fit: favorable
    functional_fit: favorable
    dependency_compatibility: compatible
    legal_review: pending
    spp_fit: favorable
    criteria:
      modification: "Sí"
      redistribution: "Sí"
      preserve_notices: "Sí + NOTICE"
      patents: "Sí"
      binary_distribution: "Licencia + NOTICE"
      copyleft: "No"
      copyleft_scope: "—"
      drm_anti_tivoization: "No"
      network_saas: "Sin restriccion"
      proprietary_combination: "Sí, cualquiera"
      relicensing: "Sí, cualquiera"
    key_obligations:
      - notice_preservation
    risks_or_restrictions: []
    observations: "Misma familia de licencias que la mayoria de sus dependencias (Apache-2.0). Buena opcion si ocr-core termina en Apache-2.0."
    conclusion: suitable

  - id: Privada-institucional
    included: true
    source_reference: "no corresponde a fila del catalogo"
    technical_fit: favorable # sin dependencias con copyleft, no hay conflicto tecnico
    functional_fit: conditional # coherente con que es un utility_component sin vocacion de reutilizacion externa, pero limita colaboracion
    dependency_compatibility: compatible
    legal_review: pending
    spp_fit: not_applicable
    criteria:
      modification: "Restringida por licencia propia"
      redistribution: "No, uso interno exclusivo"
      preserve_notices: "No aplica"
      patents: "No aplica"
      binary_distribution: "No aplica"
      copyleft: "No"
      copyleft_scope: "—"
      drm_anti_tivoization: "No aplica"
      network_saas: "Sin restriccion (uso interno)"
      proprietary_combination: "Sí"
      relicensing: "No aplica"
    key_obligations: []
    risks_or_restrictions:
      - "Dado que maneja datos personales indirectamente (documentos indexados), mantenerlo privado es coherente con minimizar exposicion, aunque el codigo en si no contenga datos."
    observations: >
      Dado que es utility_component sin vocacion de reutilizacion (no es una solucion
      independiente, solo complementa Munis), esta opcion es razonable por defecto.
    conclusion: suitable_with_conditions

recommendation:
  technical_recommendation: Privada institucional (o alinear con la licencia final de ocr-core si se opta por Apache-2.0/MIT)
  rationale: >
    Sin dependencias con copyleft, la decision aqui es de bajo riesgo tecnico.
    Al ser un utility_component sin vocacion de reutilizacion externa (no es
    solucion independiente), mantenerlo privado institucional es razonable,
    salvo que se decida alinear su licencia con la de ocr-core por consistencia
    de la cadena de valor completa.
  unresolved_issues:
    - Depende de la decision final de licenciamiento de ocr-core para evaluar consistencia.
  requires_legal_review: false
