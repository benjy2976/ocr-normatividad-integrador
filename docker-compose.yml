services:

  # ─────────────────────────────────────────────────────────────────────────
  # normatividad-worker: consumidor activo de la cola OCR de Normatividad.
  # Sin puertos expuestos - proceso interno de polling.
  # Sin GPU: no ejecuta el motor OCR, solo orquesta llamadas HTTP a ocr-core.
  # ─────────────────────────────────────────────────────────────────────────
  normatividad-worker:
    build: ./adapter
    environment:
      # ── Normatividad ──────────────────────────────────────────────────
      NORMATIVIDAD_BASE_URL: ${NORMATIVIDAD_BASE_URL:-}
      NORMATIVIDAD_OCR_TOKEN: ${NORMATIVIDAD_OCR_TOKEN:-}
      # ── ocr-core ──────────────────────────────────────────────────────
      OCR_CORE_URL: ${OCR_CORE_URL:-http://ocr-core:8000}
      OCR_CORE_JOB_TIMEOUT_SECONDS: ${OCR_CORE_JOB_TIMEOUT_SECONDS:-1800}
      OCR_CORE_JOB_POLL_INTERVAL_SECONDS: ${OCR_CORE_JOB_POLL_INTERVAL_SECONDS:-2}
      OCR_CORE_META_TTL_SECONDS: ${OCR_CORE_META_TTL_SECONDS:-60}
      OCR_CORE_SUBMIT_MAX_RETRIES: ${OCR_CORE_SUBMIT_MAX_RETRIES:-2}
      OCR_CORE_HTTP_TIMEOUT_SECONDS: ${OCR_CORE_HTTP_TIMEOUT_SECONDS:-30}
      OCR_FORCE_REPROCESS_ENABLED: ${OCR_FORCE_REPROCESS_ENABLED:-false}
      OCR_TELEMETRY_FORWARD_ENABLED: ${OCR_TELEMETRY_FORWARD_ENABLED:-false}
      OCR_SOURCE_REUSE_ENABLED: ${OCR_SOURCE_REUSE_ENABLED:-false}
      OCR_CORE_CAPABILITIES_REQUIRED: ${OCR_CORE_CAPABILITIES_REQUIRED:-false}
      OCR_QUEUE_HEARTBEAT_ENABLED: ${OCR_QUEUE_HEARTBEAT_ENABLED:-false}
      OCR_QUEUE_HEARTBEAT_SECONDS: ${OCR_QUEUE_HEARTBEAT_SECONDS:-60}
      # Core candidato: recibe la misma fuente NFS, pero escribe solo en su
      # volumen privado. Apagado por defecto para no alterar la operacion.
      OCR_SHADOW_ENABLED: ${OCR_SHADOW_ENABLED:-false}
      OCR_SHADOW_CORE_URL: ${OCR_SHADOW_CORE_URL:-http://core-ocr:8000}
      OCR_SHADOW_OUTPUT_ROOT: ${OCR_SHADOW_OUTPUT_ROOT:-/shadow-cache/review}
      OCR_SHADOW_SUBMIT_TIMEOUT_SECONDS: ${OCR_SHADOW_SUBMIT_TIMEOUT_SECONDS:-30}
      # ── Storage compartido con ocr-core ──────────────────────────────
      OCR_SHARED_CACHE_DIR: /nfs-cache
      # ── Worker ────────────────────────────────────────────────────────
      OCR_WORKER_NAME: ${OCR_WORKER_NAME:-normatividad-worker-1}
      OCR_WORKER_CONCURRENCY: ${OCR_WORKER_CONCURRENCY:-1}
      OCR_POLL_INTERVAL_SECONDS: ${OCR_POLL_INTERVAL_SECONDS:-10}
      OCR_WORKER_ENABLED: ${OCR_WORKER_ENABLED:-true}
      OCR_CALLBACK_TIMEOUT_SECONDS: ${OCR_CALLBACK_TIMEOUT_SECONDS:-30}
      OCR_DOWNLOAD_TIMEOUT_SECONDS: ${OCR_DOWNLOAD_TIMEOUT_SECONDS:-120}
      OCR_WORKER_MAX_CONSECUTIVE_ERRORS: ${OCR_WORKER_MAX_CONSECUTIVE_ERRORS:-20}
      OCR_WORKER_LOG_LEVEL: ${OCR_WORKER_LOG_LEVEL:-INFO}
      # ── Reintentos HTTP hacia Normatividad ───────────────────────────
      OCR_HTTP_MAX_RETRIES: ${OCR_HTTP_MAX_RETRIES:-6}
      OCR_HTTP_RETRY_BASE_SECONDS: ${OCR_HTTP_RETRY_BASE_SECONDS:-2}
      OCR_HTTP_RETRY_MAX_SECONDS: ${OCR_HTTP_RETRY_MAX_SECONDS:-60}
      OCR_HTTP_DEBUG: ${OCR_HTTP_DEBUG:-false}
    volumes:
      # Debe ser el MISMO volumen que monta ocr-core como OCR_SHARED_CACHE_DIR.
      - ocr_nfs_cache:/nfs-cache
    networks:
      - grh_network
    # El entorno local puede impedir el autoarranque del consumidor sin
    # cambiar la política de los demás servicios del repositorio.
    restart: "${OCR_WORKER_RESTART_POLICY:-unless-stopped}"
    # Rotación de logs: al llegar a max-size Docker abre un archivo nuevo y
    # elimina el más antiguo; nunca conserva más de max-file archivos.
    logging:
      driver: json-file
      options:
        max-size: "${OCR_WORKER_LOG_MAX_SIZE:-10m}"
        max-file: "${OCR_WORKER_LOG_MAX_FILE:-5}"

  # ─────────────────────────────────────────────────────────────────────────
  # opensearch: motor de busqueda documental
  # Puerto externo: 19200 -> interno: 9200
  # ─────────────────────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "19200:9200"
      - "19600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - grh_network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # ocr-search-api: API de busqueda sobre OpenSearch
  # Puerto externo: 18020 -> interno: 8000
  # ─────────────────────────────────────────────────────────────────────────
  ocr-search-api:
    build: ./search
    ports:
      - "18020:8000"
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-munis_ocr_pages}
      OPENSEARCH_TIMEOUT_SECONDS: ${OPENSEARCH_TIMEOUT_SECONDS:-30}
      OPENSEARCH_MAX_RETRIES: ${OPENSEARCH_MAX_RETRIES:-3}
      OPENSEARCH_SHARDS: ${OPENSEARCH_SHARDS:-1}
      OPENSEARCH_REPLICAS: ${OPENSEARCH_REPLICAS:-0}
    networks:
      - grh_network
    depends_on:
      - opensearch
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # ocr-search-indexer: indexa artefactos text JSON desde el cache compartido
  # con ocr-core (mismo volumen NFS que ocr-core monta como OCR_SHARED_CACHE_DIR)
  # ─────────────────────────────────────────────────────────────────────────
  ocr-search-indexer:
    build: ./search
    environment:
      OCR_SHARED_CACHE_DIR: /nfs-cache
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-munis_ocr_pages}
      OPENSEARCH_TIMEOUT_SECONDS: ${OPENSEARCH_TIMEOUT_SECONDS:-30}
      OPENSEARCH_MAX_RETRIES: ${OPENSEARCH_MAX_RETRIES:-3}
      OPENSEARCH_SHARDS: ${OPENSEARCH_SHARDS:-1}
      OPENSEARCH_REPLICAS: ${OPENSEARCH_REPLICAS:-0}
      SEARCH_INDEXER_POLL_INTERVAL_SECONDS: ${SEARCH_INDEXER_POLL_INTERVAL_SECONDS:-300}
      SEARCH_INDEXER_BATCH_SIZE: ${SEARCH_INDEXER_BATCH_SIZE:-500}
      SEARCH_INDEXER_LOG_LEVEL: ${SEARCH_INDEXER_LOG_LEVEL:-INFO}
    volumes:
      - ocr_nfs_cache:/nfs-cache:ro
    networks:
      - grh_network
    command: ["python3", "-m", "app.search_indexer"]
    depends_on:
      - opensearch
    restart: unless-stopped

volumes:
  opensearch_data:
  ocr_nfs_cache:
    # Debe apuntar al MISMO volumen fisico que usa ocr-core (OCR_SHARED_CACHE_DIR).
    # Confirmado 2026-09-04: el repo ocr-core (carpeta "ocr-core") crea el
    # volumen "ocr-core_ocr_nfs_cache" (Docker Compose prefija
    # <nombre_proyecto>_<nombre_volumen>, y el proyecto toma el nombre de la
    # carpeta). Verificar con `docker volume ls` si cambia.
    external: true
    name: ocr-core_ocr_nfs_cache

networks:
  grh_network:
    external: true
